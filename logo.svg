<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .eagle-gold { fill: #F4B860; }
      .eagle-dark-gold { fill: #D4922A; }
      .eagle-teal { fill: #20B2AA; }
      .eagle-black { fill: #1a1a1a; }
      .eagle-white { fill: #FFFACD; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" class="eagle-black" stroke="#555" stroke-width="2"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="70" rx="22" ry="28" class="eagle-gold"/>
  
  <!-- Beak -->
  <path d="M 115 75 L 135 73 L 115 80 Z" class="eagle-dark-gold"/>
  
  <!-- Eye -->
  <circle cx="108" cy="68" r="3.5" class="eagle-black"/>
  
  <!-- Left Wing -->
  <path d="M 85 85 Q 70 75 65 95 Q 68 92 75 90 Q 80 88 85 85" class="eagle-white"/>
  <path d="M 80 88 Q 65 80 58 100 Q 62 96 72 92 Q 78 90 80 88" class="eagle-gold"/>
  <path d="M 75 92 Q 58 88 50 110 Q 56 104 68 98 Q 73 95 75 92" class="eagle-teal"/>
  
  <!-- Right Wing -->
  <path d="M 115 85 Q 130 75 135 95 Q 132 92 125 90 Q 120 88 115 85" class="eagle-white"/>
  <path d="M 120 88 Q 135 80 142 100 Q 138 96 128 92 Q 122 90 120 88" class="eagle-gold"/>
  <path d="M 125 92 Q 142 88 150 110 Q 144 104 132 98 Q 127 95 125 92" class="eagle-teal"/>
  
  <!-- Left Wing Lower -->
  <path d="M 80 100 Q 55 105 45 130 Q 52 120 68 110 Q 75 105 80 100" class="eagle-gold"/>
  <path d="M 75 105 Q 50 115 42 145 Q 52 130 70 115 Q 75 110 75 105" class="eagle-teal"/>
  
  <!-- Right Wing Lower -->
  <path d="M 120 100 Q 145 105 155 130 Q 148 120 132 110 Q 125 105 120 100" class="eagle-gold"/>
  <path d="M 125 105 Q 150 115 158 145 Q 148 130 130 115 Q 125 110 125 105" class="eagle-teal"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="115" rx="18" ry="25" class="eagle-gold"/>
  
  <!-- Tail feathers -->
  <path d="M 90 135 L 80 155 L 85 140 Z" class="eagle-white"/>
  <path d="M 100 140 L 100 162 L 103 142 Z" class="eagle-gold"/>
  <path d="M 110 135 L 120 155 L 115 140 Z" class="eagle-white"/>
  
  <!-- Accent stripes -->
  <path d="M 88 105 Q 95 110 100 115" stroke="#20B2AA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 112 105 Q 105 110 100 115" stroke="#F4B860" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>