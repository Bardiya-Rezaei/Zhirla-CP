<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مۆدیریتوو ژیرلای</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="مۆدیریتوو ژیرلای" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#e11d48" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', system-ui, sans-serif; }
    body {
      background: linear-gradient(145deg, #fff1f2 0%, #fce7f3 50%, #fbcfe8 100%);
      min-height: 100vh; padding: 16px; padding-bottom: 40px; color: #1f2937;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .logo {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #e11d48, #db2777);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; box-shadow: 0 8px 20px rgba(225,29,72,.35); margin-bottom: 10px;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p { font-size: 13px; color: #6b7280; margin-top: 4px; }
    .card {
      background: #fff; border-radius: 24px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.08); border: 1px solid #fecdd3; margin-bottom: 16px;
    }
    .card-head { padding: 16px 18px; color: #fff; background: linear-gradient(to left, #e11d48, #db2777); }
    .card-head.green { background: linear-gradient(to left, #10b981, #0d9488); }
    .card-head.amber { background: linear-gradient(to left, #f59e0b, #ea580c); }
    .card-head.violet { background: linear-gradient(to left, #8b5cf6, #7c3aed); }
    .card-head.slate { background: linear-gradient(to left, #475569, #334155); }
    .card-head.blue { background: linear-gradient(to left, #3b82f6, #4f46e5); }
    .card-head h2 { font-size: 16px; font-weight: 700; }
    .card-head p { font-size: 12px; opacity: .85; margin-top: 2px; }
    .card-body { padding: 14px; }
    .btn-row {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: right;
      padding: 12px 14px; border-radius: 16px; border: 1px solid #e5e7eb;
      background: #f9fafb; margin-bottom: 8px; cursor: pointer;
    }
    .btn-row:active { transform: scale(.97); }
    .btn-row:last-child { margin-bottom: 0; }
    .btn-row .icon {
      width: 44px; height: 44px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0;
    }
    .btn-row .icon.green { background: #10b981; }
    .btn-row .icon.amber { background: #f59e0b; }
    .btn-row .icon.violet { background: #8b5cf6; }
    .btn-row .icon.slate { background: #475569; }
    .btn-row .icon.blue { background: #3b82f6; }
    .btn-row .txt { flex: 1; }
    .btn-row .txt strong { display: block; font-size: 14px; }
    .btn-row .txt span { font-size: 11px; color: #6b7280; }
    .btn-row .arrow { color: #9ca3af; font-size: 14px; }
    .back {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
      color: #6b7280; margin-bottom: 14px; background: none; border: none; cursor: pointer;
    }
    .hidden { display: none !important; }
    label.field { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; font-weight: 600; }
    input[type=text], input[type=number] {
      width: 100%; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 10px 12px; font-size: 14px; outline: none; background: #fff;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .mb { margin-bottom: 10px; }
    .btn {
      display: block; width: 100%; border: none; border-radius: 12px;
      padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-blue { background: #3b82f6; }
    .btn-green { background: #10b981; }
    .item {
      background: #fff; border: 1px solid #f3f4f6; border-radius: 16px;
      padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .item-name { font-size: 14px; font-weight: 700; }
    .item-price { font-size: 12px; color: #2563eb; margin-top: 2px; }
    .del-btn { background: #fef2f2; border: none; color: #ef4444; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    .stock-box { display: flex; align-items: center; gap: 8px; background: #f9fafb; border-radius: 12px; padding: 8px 10px; }
    .stock-box span { font-size: 12px; color: #6b7280; white-space: nowrap; }
    .stock-box input { width: 64px; text-align: center; padding: 6px; font-weight: 700; font-size: 13px; }
    .qbtn { width: 32px; height: 32px; border-radius: 8px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; flex-shrink: 0; }
    .qbtn.minus { background: #fee2e2; color: #dc2626; }
    .qbtn.plus { background: #d1fae5; color: #059669; }
    .qbtn.plus-green { background: #10b981; color: #fff; }
    .qbtn.gray { background: #e5e7eb; color: #374151; }
    .switch-row {
      display: flex; align-items: center; gap: 10px; background: #f9fafb;
      border: 1px solid #f3f4f6; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer;
    }
    .switch-row input { width: 18px; height: 18px; accent-color: #3b82f6; }
    .switch-row .sw-txt strong { display: block; font-size: 13px; }
    .switch-row .sw-txt span { font-size: 11px; color: #6b7280; }
    .badge-unlimited { background: #eff6ff; color: #1d4ed8; font-size: 12px; font-weight: 600; text-align: center; padding: 8px; border-radius: 12px; }
    .inv-item { display: flex; align-items: center; gap: 10px; background: #f9fafb; border-radius: 14px; padding: 12px; border: 1px solid #f3f4f6; margin-bottom: 8px; }
    .inv-item.low { border-color: #fecaca; background: #fef2f2; }
    .inv-item.unlim { border-color: #bfdbfe; background: #eff6ff; }
    .inv-item .name { font-size: 14px; font-weight: 700; }
    .inv-item .stock { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .inv-item .stock.low { color: #dc2626; font-weight: 600; }
    .inv-item .stock.unlim { color: #1d4ed8; font-weight: 600; }
    .inv-item .price { font-size: 11px; color: #9ca3af; }
    .sales-item { display: flex; align-items: center; gap: 10px; background: #f9fafb; border-radius: 14px; padding: 12px; border: 1px solid #f3f4f6; margin-bottom: 8px; }
    .sales-item .info { flex: 1; }
    .sales-item .name { font-size: 14px; font-weight: 700; }
    .sales-item .price { font-size: 12px; color: #059669; margin-top: 2px; }
    .sales-item .stock { font-size: 11px; color: #9ca3af; }
    .sales-item .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .sales-item .qty-num { width: 28px; text-align: center; font-weight: 700; font-size: 14px; }
    .summary {
      background: #fff; border-radius: 20px; padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.1); border: 1px solid #a7f3d0; position: sticky; bottom: 12px;
    }
    .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .summary-row span { font-size: 13px; color: #6b7280; }
    .summary-row strong { font-size: 22px; color: #059669; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .filter-btn { padding: 6px 12px; border-radius: 999px; font-size: 12px; border: 1px solid #fda4af; background: #fff; color: #374151; cursor: pointer; }
    .filter-btn.active { background: #e11d48; color: #fff; border-color: #e11d48; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat { background: #fff; border-radius: 16px; padding: 14px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.05); border: 1px solid #fde68a; }
    .stat .label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .stat .val { font-size: 18px; font-weight: 700; color: #d97706; }
    .stat .unit { font-size: 11px; color: #9ca3af; }
    .stat.green .val { color: #059669; }
    .stat.green { border-color: #a7f3d0; }
    .profit-list-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
    .profit-list-item:last-child { border-bottom: none; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .profit-list-item .pname { font-size: 13px; font-weight: 600; }
    .profit-list-item .pqty { font-size: 11px; color: #6b7280; }
    .profit-list-item .pamt { font-size: 13px; font-weight: 700; color: #d97706; margin-right: auto; }
    .empty { text-align: center; padding: 28px 12px; color: #9ca3af; font-size: 13px; }
    .empty small { display: block; margin-top: 6px; font-size: 11px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal { background: #fff; border-radius: 24px; padding: 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
    .modal-icon { width: 64px; height: 64px; border-radius: 50%; background: #d1fae5; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 28px; color: #059669; }
    .modal h3 { font-size: 17px; margin-bottom: 6px; }
    .modal .amt { font-size: 20px; font-weight: 700; color: #059669; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
    .bars { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
    .bar-row { display: flex; align-items: center; gap: 8px; }
    .bar-label { font-size: 11px; width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 10px; background: #f3f4f6; border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; min-width: 4px; }
    .bar-val { font-size: 11px; color: #6b7280; width: 70px; text-align: left; direction: ltr; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="56" height="56" rx="16" fill="url(#paint0_linear)"/>
          <circle cx="28" cy="24" r="8" fill="white" opacity="0.9"/>
          <path d="M28 32C32.4183 32 36 35.5817 36 40C36 41.1046 35.1046 42 34 42H22C20.8954 42 20 41.1046 20 40C20 35.5817 23.5817 32 28 32Z" fill="white" opacity="0.9"/>
          <defs>
            <linearGradient id="paint0_linear" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#e11d48"/>
              <stop offset="100%" stop-color="#db2777"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>مۆدیریتوو ژیرلای</h1>
      <p id="header-sub">داشبۆرد</p>
    </div>

    <div id="page-dashboard">
      <div class="card">
        <div class="card-head"><h2>🧃 ئاوهەنار</h2><p>مۆدیریتوو ژیرلای</p></div>
        <div class="card-body">
          <button class="btn-row" onclick="showPage('sales')"><div class="icon green">🛒</div><div class="txt"><strong>خەریدوو مۆشتەری</strong><span>خەریدوو مۆشتەری</span></div><div class="arrow">‹</div></button>
          <button class="btn-row" onclick="showPage('profit')"><div class="icon amber">📊</div><div class="txt"><strong>نموودار</strong><span>نموودار</span></div><div class="arrow">‹</div></button>
          <button class="btn-row" onclick="showPage('inventory')"><div class="icon violet">📦</div><div class="txt"><strong>هەماری</strong><span>هەماری</span></div><div class="arrow">‹</div></button>
          <button class="btn-row" onclick="showPage('management')"><div class="icon slate">⚙️</div><div class="txt"><strong>مۆدیریت</strong><span>کەلووپل</span></div><div class="arrow">‹</div></button>
        </div>
      </div>
    </div>

    <div id="page-management" class="hidden">
      <button class="back" onclick="showPage('dashboard')">‹ داشبۆرد</button>
      <div class="card">
        <div class="card-head slate"><h2>مۆدیریت</h2><p>کەلووپل</p></div>
        <div class="card-body">
          <button class="btn-row" onclick="showPage('products')"><div class="icon blue">📦</div><div class="txt"><strong>کەلووپل</strong><span>ئیزافە کەرڐو چیوی</span></div><div class="arrow">‹</div></button>
        </div>
      </div>
    </div>

    <div id="page-products" class="hidden">
      <button class="back" onclick="showPage('management')">‹ مۆدیریت</button>
      <div class="card">
        <div class="card-head blue"><h2>کەلووپل</h2><p>ئیزافە کەرڐو چیوی</p></div>
        <div class="card-body">
          <div class="mb"><label class="field">نامێ</label><input id="prod-name" type="text" placeholder="ئاوهەنار"></div>
          <div class="mb"><label class="field">قیمت بە ڕیاڵ</label><input id="prod-price" type="text" inputmode="numeric" placeholder="۴۵۰٬۰۰۰" oninput="formatPriceInput(this)"></div>
          <div class="mb" id="stock-fields"><label class="field">مەوجوودی</label><input id="prod-stock" type="number" placeholder="50"></div>
          <label class="switch-row" for="prod-unlimited">
            <input type="checkbox" id="prod-unlimited" onchange="toggleUnlimited()">
            <div class="sw-txt"><strong>نەژماریا</strong><span>نەژماریا</span></div>
          </label>
          <button class="btn btn-blue" onclick="addProduct()">ئیزافە کەرڐو چیوی</button>
        </div>
      </div>
      <div id="products-list"></div>
    </div>

    <div id="page-inventory" class="hidden">
      <button class="back" onclick="showPage('dashboard')">‹ داشبۆرد</button>
      <div class="card">
        <div class="card-head violet"><h2>هەماری</h2><p>مەوجوودی</p></div>
        <div class="card-body" id="inventory-list"></div>
      </div>
    </div>

    <div id="page-sales" class="hidden">
      <button class="back" onclick="showPage('dashboard')">‹ داشبۆرد</button>
      <div class="card">
        <div class="card-head green"><h2>خەریدوو مۆشتەری</h2><p>خەریدوو مۆشتەری</p></div>
        <div class="card-body" id="sales-products"></div>
      </div>
      <div class="summary">
        <div class="summary-row"><span>جەمعوو گرڐی</span><strong id="total-amount">۰ ڕیاڵ</strong></div>
        <button class="btn btn-green" id="pay-btn" disabled onclick="processPayment()">پرداخت بە کارتخان</button>
      </div>
    </div>

    <div id="page-profit" class="hidden">
      <button class="back" onclick="showPage('dashboard')">‹ داشبۆرد</button>
      <div class="filters">
        <button class="filter-btn active" data-filter="1d" onclick="setProfitFilter('1d')">٢٤ سەعاتێ</button>
        <button class="filter-btn" data-filter="7d" onclick="setProfitFilter('7d')">٧ڕوی</button>
        <button class="filter-btn" data-filter="30d" onclick="setProfitFilter('30d')">٣٠ ڕوی</button>
        <button class="filter-btn" data-filter="1y" onclick="setProfitFilter('1y')">١ساڵ</button>
        <button class="filter-btn" data-filter="5y" onclick="setProfitFilter('5y')">۵ساڵ</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">گرڐوو فرووشی</div><div class="val" id="profit-total">۰</div><div class="unit">ڕیاڵ</div></div>
        <div class="stat green"><div class="label">تعدادوو فرووشی</div><div class="val" id="profit-count">۰</div><div class="unit">ڕەسید</div></div>
      </div>
      <div class="card">
        <div class="card-head amber"><h2>نمووداروو ورەتەی</h2></div>
        <div class="card-body">
          <div id="bars-chart" class="bars"></div>
          <div id="no-chart-data" class="empty hidden">—</div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="card-head amber"><h2>جۆزٸیاتوو ورەتەی</h2></div>
        <div class="card-body" id="profit-products-list"></div>
      </div>
    </div>
  </div>

  <div id="payment-modal" class="modal-bg hidden">
    <div class="modal">
      <div class="modal-icon">✓</div>
      <h3>پرداخت مۆەفەق</h3>
      <div class="amt" id="payment-amount"></div>
      <p>فرووش سەپت بی</p>
      <button class="btn btn-green" onclick="closePaymentModal()">خاس</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
    }

    function toEnglishDigits(str) {
      const persian = '۰۱۲۳۴۵۶۷۸۹', english = '0123456789';
      let s = String(str);
      for (let i = 0; i < 10; i++) s = s.replace(new RegExp(persian[i], 'g'), english[i]);
      return s;
    }
    function formatPriceInput(el) {
      let raw = toEnglishDigits(el.value).replace(/[^\d]/g, '');
      if (!raw) { el.value = ''; return; }
      el.value = Number(raw).toLocaleString('fa-IR');
    }
    function parsePrice(str) { return parseInt(toEnglishDigits(str).replace(/[^\d]/g, '')) || 0; }
    function toggleUnlimited() {
      const checked = document.getElementById('prod-unlimited').checked;
      document.getElementById('stock-fields').style.display = checked ? 'none' : 'block';
      if (checked) document.getElementById('prod-stock').value = '';
    }
    function getProducts() { return JSON.parse(localStorage.getItem('anardasht_products') || '[]'); }
    function saveProducts(p) { localStorage.setItem('anardasht_products', JSON.stringify(p)); }
    function getSales() { return JSON.parse(localStorage.getItem('anardasht_sales') || '[]'); }
    function saveSales(s) { localStorage.setItem('anardasht_sales', JSON.stringify(s)); }

    const pages = ['dashboard','management','products','sales','profit','inventory'];
    const titles = { dashboard:'داشبۆرد', management:'مۆدیریت', products:'کەلووپل', sales:'خەریدوو مۆشتەری', profit:'نموودار', inventory:'هەماری' };
    function showPage(page) {
      pages.forEach(p => { const el = document.getElementById('page-' + p); if (el) el.classList.add('hidden'); });
      const t = document.getElementById('page-' + page); if (t) t.classList.remove('hidden');
      document.getElementById('header-sub').textContent = titles[page] || '';
      if (page === 'products') renderProducts();
      if (page === 'sales') renderSales();
      if (page === 'inventory') renderInventory();
      if (page === 'profit') { currentFilter = currentFilter || '1d'; renderProfit(); }
    }

    function addProduct() {
      const name = document.getElementById('prod-name').value.trim();
      const price = parsePrice(document.getElementById('prod-price').value);
      const unlimited = document.getElementById('prod-unlimited').checked;
      const stock = unlimited ? 0 : (parseInt(document.getElementById('prod-stock').value) || 0);
      if (!name || !price || price <= 0) { alert('ناموو چیوی و قیمت'); return; }
      const products = getProducts();
      products.push({ id: Date.now(), name, price, stock, unlimited });
      saveProducts(products);
      document.getElementById('prod-name').value = '';
      document.getElementById('prod-price').value = '';
      document.getElementById('prod-stock').value = '';
      document.getElementById('prod-unlimited').checked = false;
      toggleUnlimited();
      renderProducts();
    }
    function deleteProduct(id) {
      if (!confirm('لابرڐەی؟')) return;
      saveProducts(getProducts().filter(p => String(p.id) !== String(id)));
      renderProducts();
    }
    function updateStock(id, value) {
      const products = getProducts();
      const p = products.find(pr => String(pr.id) === String(id));
      if (!p || p.unlimited) return;
      const num = parseInt(value);
      if (isNaN(num) || num < 0) { renderProducts(); return; }
      p.stock = num; saveProducts(products); renderProducts();
    }
    function changeStockBy(id, delta) {
      const products = getProducts();
      const p = products.find(pr => String(pr.id) === String(id));
      if (!p || p.unlimited) return;
      p.stock = Math.max(0, p.stock + delta); saveProducts(products); renderProducts();
    }
    function toggleProductUnlimited(id) {
      const products = getProducts();
      const p = products.find(pr => String(pr.id) === String(id));
      if (!p) return;
      p.unlimited = !p.unlimited;
      if (p.unlimited) p.stock = 0;
      saveProducts(products); renderProducts();
    }
    function renderProducts() {
      const list = document.getElementById('products-list');
      const products = getProducts();
      if (!products.length) { list.innerHTML = '<div class="empty">—</div>'; return; }
      list.innerHTML = products.map(p => `
        <div class="item">
          <div class="item-top">
            <div><div class="item-name">${p.name}</div><div class="item-price">${p.price.toLocaleString('fa-IR')} ڕیاڵ</div></div>
            <button type="button" class="del-btn" onclick="deleteProduct(${p.id})">لابرڐەی</button>
          </div>
          <label class="switch-row" style="margin-bottom:8px;padding:8px 10px">
            <input type="checkbox" ${p.unlimited ? 'checked' : ''} onchange="toggleProductUnlimited(${p.id})">
            <div class="sw-txt"><strong style="font-size:12px">نەژماریا</strong></div>
          </label>
          ${p.unlimited
            ? '<div class="badge-unlimited">نەژماریا</div>'
            : `<div class="stock-box"><span>مەوجوودی:</span>
                <button type="button" class="qbtn minus" onclick="changeStockBy(${p.id},-1)">−</button>
                <input type="number" value="${p.stock}" min="0" onchange="updateStock(${p.id},this.value)">
                <button type="button" class="qbtn plus" onclick="changeStockBy(${p.id},1)">+</button></div>`}
        </div>`).join('');
    }

    function renderInventory() {
      const list = document.getElementById('inventory-list');
      const products = getProducts();
      if (!products.length) { list.innerHTML = '<div class="empty">—</div>'; return; }
      list.innerHTML = products.map(p => {
        if (p.unlimited) return `<div class="inv-item unlim"><div style="flex:1"><div class="name">${p.name}</div><div class="stock unlim">نەژماریا</div></div><div class="price">${p.price.toLocaleString('fa-IR')} ڕ</div></div>`;
        const low = p.stock <= 5;
        return `<div class="inv-item ${low?'low':''}"><div style="flex:1"><div class="name">${p.name}</div><div class="stock ${low?'low':''}">مەوجوودی: <b>${p.stock.toLocaleString('fa-IR')}</b></div></div><div class="price">${p.price.toLocaleString('fa-IR')} ڕ</div></div>`;
      }).join('');
    }

    let cart = {};
    function renderSales() {
      const container = document.getElementById('sales-products');
      const products = getProducts(); cart = {};
      if (!products.length) { container.innerHTML = '<div class="empty">—</div>'; updateTotal(); return; }
      container.innerHTML = products.map(p => `
        <div class="sales-item">
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="price">${p.price.toLocaleString('fa-IR')} ڕیاڵ</div>
            <div class="stock">${p.unlimited ? 'نەژماریا' : 'مەوجوودی: ' + p.stock.toLocaleString('fa-IR')}</div>
          </div>
          <div class="qty-ctrl">
            <button type="button" class="qbtn gray" onclick="changeQty(${p.id},-1)">−</button>
            <span class="qty-num" id="qty-${p.id}">۰</span>
            <button type="button" class="qbtn plus-green" onclick="changeQty(${p.id},1)">+</button>
          </div>
        </div>`).join('');
      updateTotal();
    }
    function changeQty(id, delta) {
      const product = getProducts().find(p => String(p.id) === String(id));
      if (!product) return;
      let next = (cart[id] || 0) + delta;
      if (next < 0) next = 0;
      if (!product.unlimited && next > product.stock) { alert('مەوجوودی'); return; }
      cart[id] = next;
      document.getElementById('qty-' + id).textContent = next.toLocaleString('fa-IR');
      updateTotal();
    }
    function updateTotal() {
      const products = getProducts(); let total = 0;
      Object.keys(cart).forEach(id => { const p = products.find(pr => String(pr.id) === String(id)); if (p) total += p.price * cart[id]; });
      document.getElementById('total-amount').textContent = total.toLocaleString('fa-IR') + ' ڕیاڵ';
      document.getElementById('pay-btn').disabled = total === 0;
    }
    function processPayment() {
      const products = getProducts(); let total = 0; const items = [];
      Object.keys(cart).forEach(id => {
        const qty = cart[id];
        if (qty > 0) {
          const p = products.find(pr => String(pr.id) === String(id));
          if (p) {
            total += p.price * qty;
            items.push({ id: p.id, name: p.name, price: p.price, qty });
            if (!p.unlimited) p.stock = Math.max(0, p.stock - qty);
          }
        }
      });
      if (total === 0) return;
      const sales = getSales();
      sales.push({ id: Date.now(), date: new Date().toISOString(), items, total });
      saveSales(sales); saveProducts(products);
      document.getElementById('payment-amount').textContent = total.toLocaleString('fa-IR') + ' ڕیاڵ';
      document.getElementById('payment-modal').classList.remove('hidden');
    }
    function closePaymentModal() { document.getElementById('payment-modal').classList.add('hidden'); showPage('sales'); }

    let currentFilter = '1d';
    const chartColors = ['#e11d48','#10b981','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
    function setProfitFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
      renderProfit();
    }
    function getFilteredSales() {
      const sales = getSales(); const now = Date.now();
      const map = { '1d':1, '7d':7, '30d':30, '1y':365, '5y':1825 };
      const cutoff = now - (map[currentFilter] || 1) * 86400000;
      return sales.filter(s => new Date(s.date).getTime() >= cutoff);
    }
    function renderProfit() {
      const filtered = getFilteredSales(); let total = 0; const productMap = {};
      filtered.forEach(sale => {
        total += sale.total;
        sale.items.forEach(item => {
          if (!productMap[item.name]) productMap[item.name] = { qty: 0, amount: 0 };
          productMap[item.name].qty += item.qty;
          productMap[item.name].amount += item.price * item.qty;
        });
      });
      document.getElementById('profit-total').textContent = total.toLocaleString('fa-IR');
      document.getElementById('profit-count').textContent = filtered.length.toLocaleString('fa-IR');
      const listEl = document.getElementById('profit-products-list');
      const entries = Object.entries(productMap).sort((a,b) => b[1].amount - a[1].amount);
      if (!entries.length) listEl.innerHTML = '<div class="empty">—</div>';
      else listEl.innerHTML = entries.map(([name, data], i) => `
        <div class="profit-list-item">
          <div class="dot" style="background:${chartColors[i % chartColors.length]}"></div>
          <div><div class="pname">${name}</div><div class="pqty">${data.qty.toLocaleString('fa-IR')}</div></div>
          <div class="pamt">${data.amount.toLocaleString('fa-IR')} ڕ</div>
        </div>`).join('');
      const barsEl = document.getElementById('bars-chart');
      const noData = document.getElementById('no-chart-data');
      if (!entries.length) { barsEl.innerHTML = ''; noData.classList.remove('hidden'); return; }
      noData.classList.add('hidden');
      const maxAmt = Math.max(...entries.map(e => e[1].amount), 1);
      barsEl.innerHTML = entries.map(([name, data], i) => {
        const pct = Math.round((data.amount / maxAmt) * 100);
        return '<div class="bar-row"><div class="bar-label">' + name + '</div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + chartColors[i % chartColors.length] + '"></div></div><div class="bar-val">' + data.amount.toLocaleString('fa-IR') + '</div></div>';
      }).join('');
    }
    showPage('dashboard');
  </script>
</body>
</html>
